<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Deep Slate to Royal Blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Document Gradient: Crisp Administrative Pearl -->
    <linearGradient id="docGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eff4ff" />
    </linearGradient>

    <!-- Folded Corner Gradient -->
    <linearGradient id="foldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbdbf5" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>

    <!-- Verification Spark / Emerald Gradient -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Drop Shadows for Tactical Administrative Bento Depth -->
    <filter id="bentoShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45" />
    </filter>

    <filter id="sparkShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#059669" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle App Badge Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.25" />

  <!-- Document Sheet with Folded Corner -->
  <g filter="url(#bentoShadow)">
    <!-- Base Document Polygon (Main body with top-right fold cut) -->
    <path d="M 140 100 
             L 300 100 
             L 372 172 
             L 372 400 
             A 16 16 0 0 1 356 416 
             L 140 416 
             A 16 16 0 0 1 124 400 
             L 124 116 
             A 16 16 0 0 1 140 100 Z" 
          fill="url(#docGrad)" 
          stroke="#cbd5e1" 
          stroke-width="3" />

    <!-- Folded Top-Right Corner Flap -->
    <path d="M 300 100 
             L 300 160 
             A 12 12 0 0 0 312 172 
             L 372 172 Z" 
          fill="url(#foldGrad)" 
          stroke="#94a3b8" 
          stroke-width="2" />

    <!-- Administrative Data Lines / Bento Ledger Ribbons -->
    <rect x="164" y="160" width="100" height="14" rx="7" fill="#93c5fd" />
    <rect x="164" y="200" width="180" height="12" rx="6" fill="#cbd5e1" />
    <rect x="164" y="232" width="150" height="12" rx="6" fill="#cbd5e1" />
    <rect x="164" y="264" width="120" height="12" rx="6" fill="#e2e8f0" />
  </g>

  <!-- Emerald Verification Badge & Smart Spark Checkmark -->
  <g filter="url(#sparkShadow)">
    <!-- Verification Circle Shield Anchor -->
    <circle cx="340" cy="336" r="68" fill="url(#sparkGrad)" stroke="#ffffff" stroke-width="6" />

    <!-- Inner Crisp White Verification Checkmark -->
    <path d="M 308 336 
             L 330 358 
             L 374 314" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="12" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Star / Smart Diamond Spark Motif (Precision AI / Fast Processing) -->
    <path d="M 340 236 
             Q 340 252 356 252 
             Q 340 252 340 268 
             Q 340 252 324 252 
             Q 340 252 340 236 Z" 
          fill="#38bdf8" />
  </g>
</svg>
